sensor:
  # ============================================================================
  # APC SMART-UPS - HIGH-PRECISION POWERNET MIB PACKAGE
  # Tested on APC Smart-UPS SMT2200I with Network Management Card (AOS v7.2.2)
  # Replace '192.168.1.101' with your APC NMC IP address.
  # Replace 'public' with your SNMPv1 read-only community string.
  # ============================================================================

  # --- CRITICAL STATUS & EVENTS (15-20s) ---
  - platform: snmp
    name: apc_ups_status
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.4.1.1.0
    accept_errors: true
    scan_interval: 15
    value_template: >-
      {% set states = {
        '1': 'Unknown',
        '2': 'On Line',
        '3': 'On Battery',
        '4': 'On Smart Boost',
        '5': 'Timed Sleeping',
        '6': 'Software Bypass',
        '7': 'Off',
        '8': 'Rebooting',
        '9': 'Switched Bypass',
        '10': 'Hardware Failure Bypass',
        '11': 'Sleeping Until Power Returns',
        '12': 'On Smart Trim'
      } %}
      {{ states.get(value, 'Unknown (' ~ value ~ ')') }}

  - platform: snmp
    name: apc_ups_last_transfer_reason
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.3.2.5.0
    accept_errors: true
    scan_interval: 20
    value_template: >-
      {% set reasons = {
        '1': 'No events',
        '2': 'High line voltage',
        '3': 'Brownout',
        '4': 'Loss of mains power',
        '5': 'Small temporary power drop',
        '6': 'Large temporary power drop',
        '7': 'Small spike',
        '8': 'Large spike',
        '9': 'UPS self test',
        '10': 'Excessive input voltage fluctuation'
      } %}
      {{ reasons.get(value, 'Unknown (' ~ value ~ ')') }}

  - platform: snmp
    name: apc_ups_comm_status
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.8.1.0
    accept_errors: true
    scan_interval: 20
    value_template: "{% if value == '1' %}on{% elif value == '2' %}off{% endif %}"

  # --- HIGH-PRECISION POWER & BATTERY METRICS (15-60s) ---
  - platform: snmp
    name: apc_ups_battery_soc
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.2.3.1.0
    accept_errors: true
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    scan_interval: 30
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  - platform: snmp
    name: apc_ups_runtime_remaining
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.2.2.3.0
    accept_errors: true
    scan_interval: 30
    value_template: >-
      {% set time = ((value | int) / 100) | int %}
      {% set minutes = ((time % 3600) / 60) | int %}
      {% set hours = ((time % 86400) / 3600) | int %}
      {% set days = (time / 86400) | int %}
      {%- if time < 60 -%} Less than a minute {%- else -%}
      {%- if days > 0 -%} {{ days }}d {%- endif -%}
      {%- if hours > 0 -%} {%- if days > 0 -%} {{ ' ' }} {%- endif -%} {{ hours }}h {%- endif -%}
      {%- if minutes > 0 -%} {%- if days > 0 or hours > 0 -%} {{ ' ' }} {%- endif -%} {{ minutes }}m {%- endif -%}
      {%- endif -%}

  - platform: snmp
    name: apc_ups_output_power
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.4.2.8.0
    accept_errors: true
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    scan_interval: 15

  - platform: snmp
    name: apc_ups_apparent_power
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.4.2.9.0
    accept_errors: true
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    scan_interval: 15

  - platform: snmp
    name: apc_ups_load_percentage
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.4.3.3.0
    accept_errors: true
    unit_of_measurement: "%"
    state_class: measurement
    scan_interval: 15
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  - platform: snmp
    name: apc_ups_output_current
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.4.3.4.0
    accept_errors: true
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    scan_interval: 15
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  - platform: snmp
    name: apc_ups_input_voltage
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.3.3.1.0
    accept_errors: true
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    scan_interval: 15
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  - platform: snmp
    name: apc_ups_output_voltage
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.4.3.1.0
    accept_errors: true
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    scan_interval: 15
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  - platform: snmp
    name: apc_ups_output_frequency
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.4.3.2.0
    accept_errors: true
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    scan_interval: 20
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  - platform: snmp
    name: apc_ups_energy_total
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.4.3.6.0
    accept_errors: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    scan_interval: 60
    value_template: "{{ ((value | float) / 100) | round(2) }}"

  # --- BATTERY LIFECYCLE & DIAGNOSTICS (60s - 3600s) ---
  - platform: snmp
    name: apc_ups_battery_temperature
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.2.3.2.0
    accept_errors: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    scan_interval: 60
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  - platform: snmp
    name: apc_ups_battery_voltage
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.2.3.4.0
    accept_errors: true
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    scan_interval: 60
    value_template: "{{ ((value | float) / 10) | round(1) }}"

  - platform: snmp
    name: apc_ups_battery_status
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.2.2.4.0
    accept_errors: true
    scan_interval: 300
    value_template: "{% if value == '1' %}Good{% elif value == '2' %}Failed{% endif %}"

  - platform: snmp
    name: apc_ups_battery_installed_date
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.2.1.3.0
    accept_errors: true
    scan_interval: 3600

  - platform: snmp
    name: apc_ups_battery_sku
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.2.2.19.0
    accept_errors: true
    scan_interval: 3600

  - platform: snmp
    name: apc_ups_last_self_test_result
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.7.2.3.0
    accept_errors: true
    scan_interval: 600
    value_template: >-
      {% if value == '1' %}OK{% elif value == '2' %}Failed{% elif value == '3' %}Invalid Test{% elif value == '4' %}Test In Progress{% endif %}

  - platform: snmp
    name: apc_ups_last_self_test_date
    host: 192.168.1.101
    community: public
    baseoid: 1.3.6.1.4.1.318.1.1.1.7.2.4.0
    accept_errors: true
    scan_interval: 600
